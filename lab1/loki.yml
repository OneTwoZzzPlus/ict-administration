auth_enabled: false

server:
    http_listen_port: 3100

common:
    path_prefix: /loki
    ring:
        kvstore:
            store: inmemory
    storage:
        filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules

query_scheduler:
    scheduler_ring:
        kvstore:
            store: inmemory

schema_config:
    configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
              prefix: index_
              period: 24h
