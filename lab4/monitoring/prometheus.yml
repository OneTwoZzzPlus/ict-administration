global:
    scrape_interval: 5s
    scrape_timeout: 3s
    evaluation_interval: 5s

alerting:
    alertmanagers:
        - static_configs:
              - targets:
                    - alertmanager:9093

rule_files:
    - /etc/prometheus/alert-rules.yml

scrape_configs:
    - job_name: elasticsearch
      static_configs:
          - targets: ["es-exporter:9114"]
            labels:
                cluster: docker-cluster
