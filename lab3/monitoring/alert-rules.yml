groups:
    - name: lab3-postgres
      rules:
          - alert: NoPrimary
            expr: |
                (count(up{job=~"postgres-.*"} == 1 and on(job) pg_replication_is_replica{job=~"postgres-.*"} == 0) or vector(0)) == 0
            for: 15s
            labels:
                severity: critical
            annotations:
                summary: "Нет ни одного живого primary"
                description: "Ни один узел не отвечает в роли primary, записи в кластер невозможны. Нужен промоушен standby или восстановление primary."

          - alert: NoStandby
            expr: |
                ((count(pg_stat_replication_pg_wal_lsn_diff{job="postgres-primary"}) or vector(0)) == 0)
                and on() (up{job="postgres-primary"} == 1)
            for: 15s
            labels:
                severity: critical
            annotations:
                summary: "Standby не подключён к primary"
                description: "В pg_stat_replication у primary нет ни одной реплики. Копии данных нет: при падении primary записи будут потеряны. В синхронном режиме COMMIT будут ждать реплику."

          - alert: HighReplicationLag
            expr: |
                max(pg_stat_replication_pg_wal_lsn_diff{job="postgres-primary"}) > 1048576
            for: 30s
            labels:
                severity: warning
            annotations:
                summary: "Высокий лаг standby"
                description: "Отставание standby больше 1 МБ WAL дольше 30 секунд: {{ $value | humanize1024 }}B. Чтения с standby устаревают, а при падении primary записи из отставания потеряются."
